[package]
name = "agentic-ai-lab-cedar-authority"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Agentic AI Lab strict Cedar authorization and single-use runtime admission boundary"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
aot-runtime-host = []
ffi-qualification = []
runtime-host-qualification = []

[[test]]
name = "runtime_ffi"
required-features = ["ffi-qualification"]

[[test]]
name = "runtime_host"
required-features = ["runtime-host-qualification"]

[[test]]
name = "authorization"
required-features = ["runtime-host-qualification"]

[[test]]
name = "case_check"
required-features = ["runtime-host-qualification"]

[dependencies]
cedar-policy.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
hex.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
