name: Runtime WASM package

on:
  push:
    branches:
      - main
    paths:
      - bindings/runtime-wasm/**
      - bindings/runtime-c/bundle-v1/**
      - BUILD.bazel
      - build.ss
      - modules/workflow/control-plane/plan.ss
      - core
      - modules/workflow/scenario/**
      - t/profile-composition-test.ss
      - .github/workflows/runtime-wasm-package.yml
      - packages/automation/install_gerbil_release.py
  pull_request:
    paths:
      - bindings/runtime-wasm/**
      - bindings/runtime-c/bundle-v1/**
      - BUILD.bazel
      - build.ss
      - modules/workflow/control-plane/plan.ss
      - core
      - modules/workflow/scenario/**
      - t/profile-composition-test.ss
      - .github/workflows/runtime-wasm-package.yml
      - packages/automation/install_gerbil_release.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-wasm-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize Core source directory
        run: git submodule update --init core

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Gerbil and WebAssembly toolchain
        shell: bash
        run: |
          set -euo pipefail
          brew list --formula ghostscript >/dev/null 2>&1 && brew unlink ghostscript || true
          brew install gcc jq openssl pkg-config sqlite zlib emscripten binaryen bazelisk
          test -x /opt/homebrew/bin/gcc-16
          python3 packages/automation/install_gerbil_release.py "$GITHUB_WORKSPACE/.ci/gerbil-release/v0.19-2591dcd"

      - name: Declare Bazel disk-cache generation
        shell: bash
        env:
          POO_FLOW_BAZEL_CACHE_GENERATION: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p .ci/bazel-cache-generation
          printf '# POO Flow Runtime-WASM cache generation: %s\n' \
            "$POO_FLOW_BAZEL_CACHE_GENERATION" \
            > .ci/bazel-cache-generation/BUILD.bazel

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          cache-save: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
          cache-version: 1
          disk-cache: runtime-wasm-${{ runner.os }}
          repository-cache: true

      - name: Verify Bazel module lock
        run: bazelisk mod deps --lockfile_mode=error

      - name: Resolve shared Gerbil capability
        shell: bash
        run: |
          set -euo pipefail
          set +e
          native_abi_output="$(
            bazelisk run --ui_event_filters=-info --noshow_progress \
              @gerbil_bazel//gerbil:native_abi_fingerprint 2>&1
          )"
          native_abi_status=$?
          set -e
          if (( native_abi_status != 0 )); then
            printf '%s\n' "$native_abi_output" >&2
            exit "$native_abi_status"
          fi
          native_abi="$(printf '%s\n' "$native_abi_output" | awk '/^[0-9a-f]{40}$/ { value = $0 } END { print value }')"
          if [[ "${#native_abi}" -ne 40 ]]; then
            printf '%s\n' "$native_abi_output" >&2
            exit 1
          fi
          echo "GERBIL_NATIVE_ABI=$native_abi" >> "$GITHUB_ENV"

      - name: Validate POO Flow Gerbil dependency graph
        timeout-minutes: 2
        shell: bash
        run: |
          test -n "$(bazelisk query 'somepath(//:compile, //:asp_gerbil_scheme_package)')"
          test -n "$(bazelisk query 'somepath(//:compile, //:gerbil_poo_package)')"
          test -n "$(bazelisk query 'somepath(//:compile, //:gerbil_parser_package)')"
          test -n "$(bazelisk query 'somepath(//:gerbil_parser_package, //:poo_flow_core_package)')"

      - name: Build declared Gerbil dependency projects
        timeout-minutes: 12
        run: bazelisk build //:dependency_packages

      - name: Build, test, and pack the package
        # Dependency actions are materialized and attributed by the preceding
        # phase. This budget covers the POO Flow package and Runtime-WASM lane.
        timeout-minutes: 25
        shell: bash
        run: |
          export POO_FLOW_BAZEL_PATH="$PATH"
          cp LICENSE bindings/runtime-wasm/LICENSE
          npm --prefix bindings/runtime-wasm test
          archive_json="$(npm pack ./bindings/runtime-wasm --ignore-scripts --json --pack-destination "$RUNNER_TEMP")"
          archive="$(jq -r '.[0].filename' <<< "$archive_json")"
          payload="$RUNNER_TEMP/poo-flow-runtime-wasm-package"
          mkdir -p "$payload"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$payload" --strip-components=1
          printf '%s\n' "$GITHUB_SHA" > "$payload/.poo-flow-source-rev"

      - name: Upload verified package payload
        uses: actions/upload-artifact@v7
        with:
          name: poo-flow-runtime-wasm-package-payload
          path: ${{ runner.temp }}/poo-flow-runtime-wasm-package
          include-hidden-files: true
          if-no-files-found: error

  publish-package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: source-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified package payload
        uses: actions/download-artifact@v8
        with:
          name: poo-flow-runtime-wasm-package-payload
          path: ${{ runner.temp }}/package-payload

      - name: Materialize independent package branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch_dir="$RUNNER_TEMP/npm-package-branch"
          git clone --filter=blob:none --no-checkout "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$branch_dir"
          git -C "$branch_dir" checkout --orphan npm-package-next
          git -C "$branch_dir" rm -rf .
          cp -R "$RUNNER_TEMP/package-payload/." "$branch_dir/"
          git -C "$branch_dir" add -A
          (
            cd "$RUNNER_TEMP/package-payload"
            find . -type f -print | sed 's#^./##' | LC_ALL=C sort
          ) > "$RUNNER_TEMP/expected-package-files"
          git -C "$branch_dir" ls-files | LC_ALL=C sort > "$RUNNER_TEMP/actual-package-files"
          diff -u "$RUNNER_TEMP/expected-package-files" "$RUNNER_TEMP/actual-package-files"
          git -C "$branch_dir" -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "package: $GITHUB_SHA"
          git -C "$branch_dir" push origin HEAD:refs/heads/npm-package --force
