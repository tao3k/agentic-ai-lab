name: Nix adapters
on:
  pull_request:
    paths:
      - 'modules/nix/**'
      - 'modules/services/**'
      - 'bindings/nix-c-api/**'
      - 'scenarios/**'
      - 't/**'
      - 'dev/just/dependencies.just'
      - 'dev/just/testing.just'
      - 'core'
      # These inputs own the shared native dependency and adapter projection.
      - 'packages/automation/install_gerbil_release.py'
      - 'gerbil.pkg'
      - 'build.ss'
      - 'build-spec.ss'
      - 'init.ss'
      - 'services.ss'
      - 'nix-contracts.ss'
      - 'opentofu-contracts.ss'
      - '.github/workflows/nix.yml'
      - '.github/actions/setup-gerbil/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapters:
    name: Nix / OpenTofu (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      GERBIL_PATH: ${{ github.workspace }}/.gerbil
      GERBIL_BUILD_CORES: '2'
      GERBIL_TEST_MAX_HEAP: 2G
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: true
      - uses: ./.github/actions/setup-gerbil
      - name: Build the library and selected product adapters
        run: |
          gerbil env gerbil interactive packages/automation/runtime-dependencies.ss
          # The vendored Core owns the POO revision for the final native build.
          (
            cd core
            gerbil env gerbil interactive ../packages/automation/runtime-dependencies.ss
            gerbil env gerbil clean
          )
          gerbil env just build-core
          gerbil env gerbil interactive packages/automation/runtime-dependencies.ss --rebuild-core-dependents
          gerbil env just build-library build-test-workers
      - name: Realize locked Provider qualification inputs
        run: |
          inputs=$(nix-build --no-out-link t/fixtures/opentofu/ci.nix)
          families=$(readlink -f "$inputs/families")
          {
            echo "AGENTIC_AI_LAB_OPENTOFU_TEST_INPUTS=$inputs"
            echo "AGENTIC_AI_LAB_OPENTOFU_ARTIFACT=$families"
            echo "AGENTIC_AI_LAB_OPENTOFU_FLAKE_ARTIFACT=$families"
            echo "YUANXU_JSON_SCHEMA_AWS_EXPORT=$families/aws/schema.json"
            echo "AGENTIC_AI_LAB_OPENTOFU_TEST_AWS_ONLY_ARTIFACT=$(readlink -f "$inputs/awsOnly")"
            echo "AGENTIC_AI_LAB_OPENTOFU_TEST_REBUILT=$(readlink -f "$inputs/awsNull")"
            echo "AGENTIC_AI_LAB_OPENTOFU_TEST_PARENT_ARTIFACT=$(readlink -f "$inputs/parent")"
            echo "AGENTIC_AI_LAB_OPENTOFU_TEST_CHILD_ARTIFACT=$(readlink -f "$inputs/child")"
            echo "YUANXU_AWS_BINARY=$(readlink -f "$inputs/binary")/provider"
            echo "AGENTIC_AI_LAB_NIX_TEST_TOOLS=$(cat "$inputs/tools")"
          } >> "$GITHUB_ENV"
      - name: Serial product adapter regressions
        run: |
          gerbil env just test-root \
            t/integration/nix/*-test.ss \
            t/yanxu/scenarios/aws/*-test.ss \
            t/yanxu/modules/nix/*-test.ss t/yanxu/modules/services/opentofu/*-test.ss \
            t/integration/lab/dependencies/json-schema-aws-*-test.ss \
            t/integration/lab/core/execution-progress-test.ss \
            t/library/building/approved-build-recovery-test.ss t/library/building/build-store-recovery-test.ss
