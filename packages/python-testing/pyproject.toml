[project]
name = "agentic-ai-lab-testing"
version = "0.1.0"
description = "Module and cross-module case testing for Agentic AI Lab."
license = "Apache-2.0 AND LGPL-2.1-or-later"
license-files = ["LICENSE"]
readme = { file = "README.org", content-type = "text/plain" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
live = ["openai>=2.29,<3", "httpx>=0.28,<0.29"]
runtime = ["agentic-ai-lab-runtime==0.1.0"]

[project.scripts]
agentic-ai-lab-test-cases = "agentic_ai_lab_testing.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "python-lang-project-harness[pytest] ; python_full_version >= '3.12'",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agentic_ai_lab_testing.ascent" = ["attempt.ss", "finite_attempt.ss", "stratified_attempt.ss"]
"agentic_ai_lab_testing.model_study.scheme_source" = ["*.ss", "*.sexp"]
"agentic_ai_lab_testing.temporal" = ["attempt.ss"]
"agentic_ai_lab_testing.model_study" = ["cases.json", "scheme_questions.json"]

[tool.pytest.ini_options]
addopts = ["--python-project-harness"]
testpaths = ["tests"]
pythonpath = ["src", "../python-runtime/src"]

[tool.uv.sources]
agentic-ai-lab-runtime = { path = "../python-runtime" }
python-lang-project-harness = { git = "https://github.com/tao3k/python-lang-project-harness" }
