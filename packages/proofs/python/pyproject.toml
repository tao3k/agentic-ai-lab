[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agentic-ai-lab-proof"
version = "0.1.0"
description = "Typed Lean artifact generation for agentic-ai-lab proof manifests."
license = "Apache-2.0 AND LGPL-2.1-or-later"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cffi>=1.17.0"]

[project.optional-dependencies]
axle = ["axiom-axle>=1.3.0"]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.14.11,<0.15"
]

[project.scripts]
agentic-ai-lab-proof = "agentic_ai_lab_proof.cli:main"
agentic-ai-lab-axle-verify = "agentic_ai_lab_proof.axle_verify:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
