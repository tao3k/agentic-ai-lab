name: Context governance proof
on:
  push:
    branches: [main]
    paths:
      - 'docs/10-19-design/10.06-poo-module-system/agentic-ai-context/4[0-8]-*'
      - 'docs/10-19-design/10.06-poo-module-system/agentic-ai-context/00-design-map.org'
      - 'docs/10-19-design/10.06-poo-module-system/agentic-ai-context/run-context-governance-chain.py'
      - 'proofs/ContextGovernance/**'
      - 'dev/d2/governance-figures.sysml'
      - 'dev/d2/governance-illustrations.ts'
      - 'dev/d2/package.json'
      - 'dev/d2/bun.lock'
      - 'dev/just/proofs.just'
      - '.github/workflows/context-governance-proof.yml'
  pull_request:
    paths:
      - 'docs/10-19-design/10.06-poo-module-system/agentic-ai-context/4[0-8]-*'
      - 'docs/10-19-design/10.06-poo-module-system/agentic-ai-context/00-design-map.org'
      - 'docs/10-19-design/10.06-poo-module-system/agentic-ai-context/run-context-governance-chain.py'
      - 'proofs/ContextGovernance/**'
      - 'dev/d2/governance-figures.sysml'
      - 'dev/d2/governance-illustrations.ts'
      - 'dev/d2/package.json'
      - 'dev/d2/bun.lock'
      - 'dev/just/proofs.just'
      - '.github/workflows/context-governance-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: context-governance-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  context-governance-lake-proof:
    name: Lake proof & full-namespace axiom audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check pinned source-binding SHA-256 lockfile and ORG modularity budget
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/10-19-design/10.06-poo-module-system/agentic-ai-context/run-context-governance-chain.py --bindings-only
          python3 packages/automation/org_modularization.py scan --max-lines 1000 --fail-on-unmodularized
      - name: Install the declared Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat proofs/ContextGovernance/lean-toolchain)"
      - name: Build ContextGovernance Lake package and audit all 9 namespaces
        working-directory: proofs/ContextGovernance
        shell: bash
        run: |
          set -euo pipefail
          lake build
          lake env lean ContextGovernanceAxioms.lean

  context-governance-full-chain:
    name: SysML v2 + Lean 4 + Quint (TLC & Apalache) + ITF replay chain
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install pinned OpenSysML v0.10.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/opensysml/bin"
          archive="$RUNNER_TEMP/opensysml-linux-amd64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/Open-MBEE/OpenSysML/releases/download/v0.10.1/opensysml-linux-amd64.tar.gz"
          printf '%s  %s\n' \
            'f5aaeafd49a66f5e9771eb02616fc0f88cc310dc96d242ba2dcf7cb43ede91d1' \
            "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP/opensysml/bin"
          chmod +x "$RUNNER_TEMP/opensysml/bin/sysml"
          echo "$RUNNER_TEMP/opensysml/bin" >> "$GITHUB_PATH"
      - name: Install the declared Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat proofs/ContextGovernance/lean-toolchain)"
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare pinned Quint 0.33.0 & Apalache 0.62.1 backend
        env:
          QUINT_HOME: ${{ runner.temp }}/agentic-ai-lab-quint-cache
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix packages/proofs/quint --no-audit --no-fund
          python3 packages/proofs/quint/prepare_backend.py
          echo "$GITHUB_WORKSPACE/packages/proofs/quint/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Execute full Slices 40-48 assurance chain and source-binding verification
        env:
          QUINT_HOME: ${{ runner.temp }}/agentic-ai-lab-quint-cache
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/10-19-design/10.06-poo-module-system/agentic-ai-context/run-context-governance-chain.py \
            --check-lake \
            --verify-bindings \
            --max-steps 8 \
            --artifacts "$RUNNER_TEMP/context-governance-chain"
      - name: Upload structured chain summary receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: context-governance-chain-summary
          path: ${{ runner.temp }}/context-governance-chain/context-governance-chain-summary.json
          if-no-files-found: warn
          retention-days: 7

  context-governance-render-check:
    name: OpenSysML visual atlas typecheck & readability gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install pinned Bun 1.3.11
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.11"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install diagram renderer dependencies and Chromium
        working-directory: dev/d2
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Typecheck and render all 8 OpenSysML governance stories
        working-directory: dev/d2
        shell: bash
        run: |
          set -euo pipefail
          bun run check
          bun run governance-figures
      - name: Verify minimum text readability across all 8 render receipts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          slugs = [
              "40-verification-dispatch",
              "42-declassification",
              "43-security-branches",
              "44-causal-survival",
              "45-hybrid-search",
              "46-sandbox-trifecta",
              "47-end-to-end-capsule",
              "48-progressive-disclosure",
          ]
          for slug in slugs:
              p = Path("dev/d2/output") / f"{slug}.receipt.json"
              data = json.loads(p.read_text(encoding="utf-8"))
              r = data["rendering"]["readability"]
              assert r["minimumTextSize"] >= r["requiredMinimum"], (slug, r)
          print(f"CONTEXT-GOVERNANCE-RENDERS-OK count={len(slugs)}")
          PY
