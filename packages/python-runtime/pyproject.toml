[project]
name = "agentic-ai-lab-runtime"
version = "0.1.0"
description = "Python runtime consumer for the Agentic AI Lab C ABI."
license = "Apache-2.0 AND LGPL-2.1-or-later"
license-files = ["LICENSE"]
readme = { file = "README.org", content-type = "text/plain" }
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.14.1",
    "cffi>=2.0.0",
    "pyturso>=0.6.1",
]

[project.scripts]
agentic-ai-lab-build-profile = "agentic_ai_lab_runtime.build_profile:main"
agentic-ai-lab-jsonschema-contract = "agentic_ai_lab_runtime.json_schema_contract:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "python-lang-project-harness[pytest] ; python_full_version >= '3.12'",
]

[build-system]
requires = ["setuptools>=75", "wheel", "cffi>=2.0.0", "setuptools-rust>=1.12,<2"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentic_ai_lab_runtime = [
  "_native/lib/*",
  "reasoning_rules/*.ss",
  "projections/*.ss",
  "projections/*.sexp",
  "projections/runtime_load_imports.json",
]

[tool.pytest.ini_options]
addopts = ["--python-project-harness"]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
python-lang-project-harness = { git = "https://github.com/tao3k/python-lang-project-harness" }

[tool.maturin]
manifest-path = "../../modules/evidence-assessment/native/Cargo.toml"
module-name = "agentic_ai_lab_runtime._reasoning"
python-source = "src"
features = ["python", "extension-module"]
