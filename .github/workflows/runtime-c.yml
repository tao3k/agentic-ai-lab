name: Runtime C ABI

on:
  push:
    branches:
      - main
    paths:
      - bindings/runtime-c/**
      - modules/workflow/contracts/runtime-v0-abi-schema.ss
      - MODULE.bazel
      - MODULE.bazel.lock
      - .github/workflows/runtime-c.yml
      - packages/automation/install_gerbil_release.py
  pull_request:
    paths:
      - bindings/runtime-c/**
      - modules/workflow/contracts/runtime-v0-abi-schema.ss
      - MODULE.bazel
      - MODULE.bazel.lock
      - .github/workflows/runtime-c.yml
      - packages/automation/install_gerbil_release.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-c-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  abi:
    name: ABI / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
      - name: Install macOS Gerbil toolchain
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install gcc jq openssl pkg-config sqlite zlib
          test -x /opt/homebrew/bin/gcc-16
          python3 packages/automation/install_gerbil_release.py "$GITHUB_WORKSPACE/.ci/gerbil-release/v0.19-2591dcd"
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Test portable C ABI
        run: |
          platform_flags=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # This job qualifies the runner ABI; old deployment targets need a
            # separate SDK compatibility matrix, not the macos-26 system SDK.
            platform_flags+=("--macos_minimum_os=$(sw_vers -productVersion)")
          fi
          bazelisk test "${platform_flags[@]}" --test_output=errors \
            //bindings/runtime-c:runtime_c_tests \
            //bindings/runtime-c/bundle-v1:bundle_v1_tests
      - name: Test Linux sanitizer boundary
        if: runner.os == 'Linux'
        run: |
          bazelisk test --test_output=errors \
            //bindings/runtime-c:runtime_c_sanitizer_tests \
            //bindings/runtime-c:runtime_v0_batch_benchmark_smoke
