name: Python runtime wheel

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: python-runtime-wheel-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wheel:
    name: Build Python runtime wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENTIC_AI_LAB_RUNTIME_V0_LIBRARY: ${{ github.workspace }}/.ci/runtime-c/libagentic_ai_lab_runtime_v0.so
      AGENTIC_AI_LAB_SEMANTIC_LIBRARY: ${{ github.workspace }}/.ci/semantic/libagentic_ai_lab_semantic.so
      PROJECTION_HANDOFF_DIR: .ci/python-wheel-projection
      PROJECTION_ARTIFACT: .ci/python-wheel-projection/wheel_smoke.ss.agentic-ai-lab-projection.sexp

    steps:
      - name: Checkout agentic-ai-lab
        uses: actions/checkout@v7.0.0

      - name: Initialize Core source directory
        run: git submodule update --init core

      - name: Install SQLite development headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Set up Python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: packages/python-runtime/uv.lock

      - name: Download Scheme projection producer handoff
        uses: actions/download-artifact@v8
        with:
          name: python-wheel-scheme-projection-producer
          path: .ci/python-wheel-projection

      - name: Download runtime-C producer handoff
        uses: actions/download-artifact@v8
        with:
          name: agentic-ai-lab-runtime-native-library
          path: .ci/runtime-c

      - name: Download semantic AOT producer handoff
        uses: actions/download-artifact@v8
        with:
          name: agentic-ai-lab-semantic-native-linux
          path: .ci/semantic

      - name: Verify semantic artifact and source binding
        run: |
          python3 - <<'PY'
          import hashlib, os, sys
          sys.path.insert(0, "packages/python-runtime/src/agentic_ai_lab_runtime")
          from scheme_wire import loads
          from pathlib import Path
          library = Path(os.environ['AGENTIC_AI_LAB_SEMANTIC_LIBRARY'])
          manifest = loads(Path(str(library) + '.ss').read_text())
          assert hashlib.sha256(library.read_bytes()).hexdigest() == manifest['artifactSha256']
          assert hashlib.sha256(Path('modules/workflow/runtime/semantic.ss').read_bytes()).hexdigest() == manifest['sourceSha256']
          assert hashlib.sha256(Path('bindings/runtime-c/src/semantic_host.c').read_bytes()).hexdigest() == manifest['hostSha256']
          assert hashlib.sha256(Path('bindings/runtime-c/include/agentic_ai_lab/semantic.h').read_bytes()).hexdigest() == manifest['headerSha256']
          PY

      - name: Verify producer handoffs
        id: producer-handoffs
        shell: bash
        run: |
          set -euo pipefail
          projection_receipt="$PROJECTION_HANDOFF_DIR/producer-receipt.json"
          runtime_receipt="$GITHUB_WORKSPACE/.ci/runtime-c/producer-receipt.json"
          runtime_acceptance="$GITHUB_WORKSPACE/.ci/runtime-c/acceptance-receipt.json"
          runtime_library="$AGENTIC_AI_LAB_RUNTIME_V0_LIBRARY"
          consumer_receipt="$GITHUB_WORKSPACE/.ci/python-wheel-consumer-receipt.json"

          test -s "$PROJECTION_ARTIFACT"
          test -s "$projection_receipt"
          test -s "$runtime_library"
          test -s "$runtime_receipt"
          test -s "$runtime_acceptance"

          jq -e --arg head "$GITHUB_SHA" '
            .schema == "agentic-ai-lab.ci.scheme-projection-handoff.v1" and
            .producerJob == "native-linux" and
            .compileOwner == "//:compile" and
            .currentHeadSha == $head and
            .status == 0 and
            .withinBudget == true and
            .artifactAvailable == true
          ' "$projection_receipt" >/dev/null
          projection_digest="$(sha256sum "$PROJECTION_ARTIFACT" | awk '{print $1}')"
          test "$projection_digest" = "$(jq -r '.artifactDigest' "$projection_receipt")"

          jq -e --arg head "$GITHUB_SHA" '
            .schema == "agentic-ai-lab.ci.runtime-c-handoff.v1" and
            .producerJob == "native-linux" and
            .producerTarget == "//bindings/runtime-c:runtime_c_shared" and
            .currentHeadSha == $head and
            .artifactAvailable == true and
            .status == 0 and
            .withinBudget == true
          ' "$runtime_receipt" >/dev/null
          jq -e '.status == 0 and .withinBudget == true' \
            "$runtime_acceptance" >/dev/null

          runtime_digest="$(sha256sum "$runtime_library" | awk '{print $1}')"
          expected_runtime_digest="$(jq -r '.artifactDigest' "$runtime_receipt")"
          acceptance_digest="$(sha256sum "$runtime_acceptance" | awk '{print $1}')"
          symbols_digest="$(
            nm -D --defined-only "$runtime_library" \
              | awk '{print $3}' \
              | sed '/^$/d' \
              | LC_ALL=C sort -u \
              | sha256sum \
              | awk '{print $1}'
          )"
          test "$runtime_digest" = "$expected_runtime_digest"
          test "$acceptance_digest" = "$(jq -r '.acceptanceReceiptDigest' "$runtime_receipt")"
          test "$symbols_digest" = "$(jq -r '.exportedSymbolsDigest' "$runtime_receipt")"

          package_projection_dir="packages/python-runtime/src/agentic_ai_lab_runtime/projections"
          mkdir -p "$package_projection_dir"
          cp "$PROJECTION_ARTIFACT" "$package_projection_dir/"

          jq -n \
            --arg schema "agentic-ai-lab.ci.python-wheel-handoff-consumer.v1" \
            --arg projectionArtifact "python-wheel-scheme-projection-producer" \
            --arg runtimeArtifact "agentic-ai-lab-runtime-native-library" \
            --arg transport "github-actions-artifact" \
            --arg projectionDigest "$projection_digest" \
            --arg expectedDigest "$expected_runtime_digest" \
            --arg actualDigest "$runtime_digest" \
            '{schema: $schema, projectionArtifact: $projectionArtifact,
              runtimeArtifact: $runtimeArtifact, transport: $transport,
              projectionDigest: $projectionDigest,
              expectedDigest: $expectedDigest, actualDigest: $actualDigest,
              gerbilSetupAbsent: true, bazelInvocationAbsent: true,
              verified: true}' > "$consumer_receipt"
          echo "receipt=$consumer_receipt" >> "$GITHUB_OUTPUT"

      - name: Upload producer handoff evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-wheel-handoff-evidence-${{ runner.os }}-${{ runner.arch }}
          path: |
            .ci/python-wheel-projection/producer-receipt.json
            .ci/runtime-c/producer-receipt.json
            .ci/runtime-c/acceptance-receipt.json
            ${{ steps.producer-handoffs.outputs.receipt }}
          if-no-files-found: warn
          retention-days: 7

      - name: Test Python native runtime against producer library
        run: |
          set -euo pipefail
          uv run --project packages/python-runtime pytest \
            packages/python-runtime/tests/unit/test_native_runtime_v0.py \
            packages/python-runtime/tests/unit/test_semantic_runtime.py \
            packages/python-runtime/tests/unit/test_semantic_observations.py \
            packages/python-runtime/tests/unit/test_semantic_tools.py \
            packages/python-runtime/tests/unit/test_temporal_family.py \
            packages/python-runtime/tests/unit/test_temporal_admission.py \
            packages/python-runtime/tests/unit/test_context_use.py \
            packages/python-runtime/tests/unit/test_temporal_publication.py

      - name: Test Python module case catalog
        run: |
          set -euo pipefail
          uv run --locked --project packages/python-testing --extra runtime --group dev pytest -q \
            packages/python-testing/tests/unit
          uv run --locked --project packages/python-testing --extra runtime agentic-ai-lab-test-cases \
            coverage > .ci/python-testing-coverage.tsv

      - name: Qualify migrated assessment and Review native semantics
        run: cargo test --locked --manifest-path modules/evidence-assessment/native/Cargo.toml --lib --test assessment

      - name: Build wheel
        run: |
          set -euo pipefail
          uv build \
            --project packages/python-runtime \
            --wheel \
            --out-dir dist/python-runtime-wheel
          ls -l dist/python-runtime-wheel

      - name: Test installed assessment against the exact ASCENT producer
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/agentic-ai-lab-reasoning-smoke"
          py="$RUNNER_TEMP/agentic-ai-lab-reasoning-smoke/bin/python"
          producer="$(python - <<'PYTHON'
          import tomllib
          from pathlib import Path
          dep = tomllib.loads(Path('modules/evidence-assessment/native/Cargo.toml').read_text())['dependencies']['gerbil-ascent']
          assert set(('git', 'rev')).issubset(dep) and 'path' not in dep
          print('git+' + dep['git'] + '@' + dep['rev'] + '#subdirectory=python')
          PYTHON
          )"
          "$py" -m pip install dist/python-runtime-wheel/*.whl "$producer"
          PYTHONPATH="$GITHUB_WORKSPACE/packages/python-testing/src" "$py" -m unittest discover -s packages/python-runtime/tests/scenarios -v
          PYTHONPATH="$GITHUB_WORKSPACE/packages/python-testing/src" "$py" -m unittest discover -s packages/python-testing/tests/assessment -v

      - name: Install wheel in clean environment
        run: |
          set -euo pipefail
          unset AGENTIC_AI_LAB_RUNTIME_V0_LIBRARY AGENTIC_AI_LAB_SEMANTIC_LIBRARY
          python -m venv "$RUNNER_TEMP/agentic-ai-lab-runtime-wheel-smoke"
          "$RUNNER_TEMP/agentic-ai-lab-runtime-wheel-smoke/bin/python" -m pip install \
            dist/python-runtime-wheel/*.whl
          "$RUNNER_TEMP/agentic-ai-lab-runtime-wheel-smoke/bin/python" -m \
            agentic_ai_lab_benchmarks --list
          "$RUNNER_TEMP/agentic-ai-lab-runtime-wheel-smoke/bin/python" -m \
            agentic_ai_lab_runtime.scheme_projection_artifact --help
          "$RUNNER_TEMP/agentic-ai-lab-runtime-wheel-smoke/bin/python" -m \
            agentic_ai_lab_runtime.benchmarks scheme-load-aot --help
          "$RUNNER_TEMP/agentic-ai-lab-runtime-wheel-smoke/bin/python" - <<'PY'
          from agentic_ai_lab_runtime._native.loader import probe_native_runtime

          health = probe_native_runtime()
          assert (health.abi_major, health.abi_minor) == (0, 1)
          print("packaged Bazel runtime-v0 negotiation: ok")
          PY
          "$RUNNER_TEMP/agentic-ai-lab-runtime-wheel-smoke/bin/python" - <<'PY'
          import shutil
          from agentic_ai_lab_runtime import scheme_wire as wire
          from agentic_ai_lab_runtime import (SemanticRuntime, RuntimeGraphProgram,
              RuntimeGraphRuntime, RuntimeGraphRegistries, linear_plan)
          from agentic_ai_lab_runtime._native.session import NativeRuntimeSession, NativeBundleDescriptor
          assert shutil.which('gxi') is None
          task = {'lens': {'generation': 1, 'clock': 'c', 'start': 0, 'end': 5,
                          'asOf': 5, 'cut': 'cut', 'members': ['a', 'b'],
                          'horizon': 8, 'closed': True},
                  'source': {'identity': 'source', 'generation': 1, 'clock': 'c',
                             'events': [['a', 1, 1], ['b', 2, 2]],
                             'parents': [['a', 'b']]}, 'root': 'a'}
          with SemanticRuntime.bundled() as runtime:
              answer = runtime.call('temporal.solve', task)
              assert answer['rows'] == [['a', 'b']]
              predicted = runtime.predict_temporal_answer(task, lambda supplied: wire.dumps(
                  {'status': 'complete', 'rows': [['a', 'b']]}))
              assert predicted['receipt']['verdict'] == 'consistent'
              assert runtime.observe_model_answer(task, wire.dumps(
                  {'status': 'complete', 'rows': [['a', 'b']]}))['verdict'] == 'consistent'
              assert runtime.observe_model_answer(task,
                  wire.dumps({'status': 'complete', 'rows': []}))['verdict'] == 'contradicted'
              with NativeRuntimeSession(NativeBundleDescriptor(bytes(32), 1, b'bundle')) as session:
                  program = RuntimeGraphProgram(plan=linear_plan('act'),
                      runtime=RuntimeGraphRuntime.native(session, semantic_context=runtime),
                      registries=RuntimeGraphRegistries(actions={
                          'act': lambda state: {'answer': state['value'] + 1}}))
                  execution = program.invoke_with_trace({'value': 41})
                  assert execution.state['answer'] == 42
                  assert execution.validation.kind == 'scheme-graph-admission'
          print('packaged no-Gerbil semantic solve and final gate: ok')
          PY
          "$RUNNER_TEMP/agentic-ai-lab-runtime-wheel-smoke/bin/python" - <<'PY'
          import shutil
          from importlib.resources import as_file, files
          from pathlib import Path

          from agentic_ai_lab_runtime._scheme_load import load_projection_rows

          for name in ("gxi", "gxc", "gxpkg"):
              assert shutil.which(name) is None, (name, shutil.which(name))

          resource = files("agentic_ai_lab_runtime").joinpath("projections/wheel_smoke.ss")
          artifact_resource = files("agentic_ai_lab_runtime").joinpath(
              "projections/wheel_smoke.ss.agentic-ai-lab-projection.sexp"
          )
          assert resource.is_file()
          assert artifact_resource.is_file()
          with as_file(resource) as source:
              workdir = Path(source).parent / "no-source-tree"
              workdir.mkdir(exist_ok=True)
              loaded = load_projection_rows(source, cwd=workdir, cache=False)

          rows = {}
          for row in loaded:
              rows[str(row[0])] = row[1] if len(row) == 2 else tuple(row[1:])
          plan = {}
          for row in rows["plan"]:
              plan[str(row[0])] = row[1] if len(row) == 2 else tuple(row[1:])
          assert rows["schema"] == "yuanxu.funflow-plan-projection.v1"
          assert rows["origin"] == "user-composition-funflow"
          assert plan["name"] == "wheel-smoke"
          print("packaged no-gerbil artifact load: ok")
          PY

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: agentic-ai-lab-runtime-wheel
          path: dist/python-runtime-wheel/*.whl
          if-no-files-found: error
