name: Runtime C ABI

on:
  push:
    branches:
      - main
    paths:
      - bindings/runtime-c/**
      - modules/workflow/contracts/runtime-v0-abi-schema.ss
      - .github/workflows/runtime-c.yml
      - packages/automation/install_gerbil_release.py
  pull_request:
    paths:
      - bindings/runtime-c/**
      - modules/workflow/contracts/runtime-v0-abi-schema.ss
      - .github/workflows/runtime-c.yml
      - packages/automation/install_gerbil_release.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-c-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  abi:
    name: ABI / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
      - name: Compile and test the portable library
        run: make -C bindings/runtime-c OUT="$RUNNER_TEMP/runtime-c" test-runtime test-bundle
      - name: Run sanitizers
        if: runner.os == 'Linux'
        run: make -C bindings/runtime-c OUT="$RUNNER_TEMP/runtime-c" sanitizers
