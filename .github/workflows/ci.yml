name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  license-contract:
    name: License contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout agentic-ai-lab
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true

      - name: Validate repository license, version, and dependency contracts
        run: |
          python3 packages/automation/check_license_contract.py
          python3 packages/automation/check_version_contract.py
          python3 packages/automation/check_namespace_contract.py
          python3 -m unittest discover -s packages/automation/tests -p 'test_*.py'

  runtime-gerbil-tests:
    name: Runtime Gerbil unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gerbil-label: release-v0.19-2591dcd
          - os: macos-26
            gerbil-label: release-v0.19-1cfb032
    env:
      # Heap capacity is per test process; compiler capacity follows the runner.
      GERBIL_TEST_MAX_HEAP: 2G
      GERBIL_RELEASE_ROOT: ${{ github.workspace }}/.ci/gerbil-release/${{ matrix.gerbil-label }}
    steps:
      - name: Checkout agentic-ai-lab
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Upload focused runtime unit-test output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-unit-output-${{ runner.os }}
          path: ${{ runner.temp }}/agentic-ai-lab-unit-tests.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Initialize Core source directory
        id: runtime-core-source
        run: |
          git submodule update --init core
          revision="$(git rev-parse HEAD:core)"
          test "$(git -C core rev-parse HEAD)" = "$revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            git \
            libsqlite3-dev \
            libssl-dev \
            openjdk-17-jre-headless \
            openssl \
            pkg-config \
            sqlite3 \
            zlib1g-dev
          # Preserve caller limits; package/test serialization does not cap
          # the native compiler's own runner-derived backend capacity.
          workers="${GERBIL_BUILD_CORES:-$(getconf _NPROCESSORS_ONLN)}"
          [[ "$workers" =~ ^[1-9][0-9]*$ ]]
          echo "GERBIL_BUILD_CORES=$workers" >> "$GITHUB_ENV"
          echo "Native compiler workers: $workers"

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew list --formula ghostscript >/dev/null 2>&1 && brew unlink ghostscript || true
          brew install coreutils gcc jq openssl pkg-config sqlite zlib
          workers="${GERBIL_BUILD_CORES:-$(sysctl -n hw.physicalcpu)}"
          [[ "$workers" =~ ^[1-9][0-9]*$ ]]
          echo "GERBIL_BUILD_CORES=$workers" >> "$GITHUB_ENV"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          "$(brew --prefix coreutils)/libexec/gnubin/timeout" --version

          gcc_prefix="$(brew --prefix gcc)"
          gcc_bin="$(
            find "$gcc_prefix/bin" -maxdepth 1 -type f -name 'gcc-[0-9]*' \
              | awk -F- '{print $NF "\t" $0}' \
              | sort -n \
              | tail -n 1 \
              | cut -f2-
          )"
          test -x "$gcc_bin"
          echo "GERBIL_GCC=$gcc_bin" >> "$GITHUB_ENV"

          openssl_prefix="$(brew --prefix openssl@3 2>/dev/null || brew --prefix openssl)"
          zlib_prefix="$(brew --prefix zlib)"
          sqlite_prefix="$(brew --prefix sqlite)"
          echo "PKG_CONFIG_PATH=$openssl_prefix/lib/pkgconfig:$zlib_prefix/lib/pkgconfig:$sqlite_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          "$gcc_bin" --version

      - name: Install pinned recipe runner
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy
          cargo +1.95.0 install just --version 1.56.0 --locked
          just --version

      - name: Install immutable Gerbil v0.19 release
        shell: bash
        run: python3 packages/automation/install_gerbil_release.py "$GERBIL_RELEASE_ROOT"

      - name: Restore Gerbil package cache
        id: runtime-gerbil-pkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .gerbil/pkg
            .gerbil/lib
            .gerbil/bin
          key: gerbil-deps-v4-${{ runner.os }}-${{ runner.arch }}-${{ matrix.gerbil-label }}-${{ steps.runtime-core-source.outputs.revision }}-${{ hashFiles('gerbil.pkg', 'core/gerbil.pkg', 'packages/automation/install_gerbil_release.py', 'packages/automation/runtime-dependencies.ss') }}

      - name: Install Gerbil package dependencies
        run: |
          mkdir -p "$HOME/.gerbil/pkg"
          gerbil pkg dir --add git.cons.io/mighty-gerbils/gerbil-directory
          rebuild_dependents=false
          if [ "${{ steps.runtime-gerbil-pkg-cache.outputs.cache-hit }}" != "true" ] ||
             ! gerbil env gerbil interactive -e '(begin (import :clan/poo/object) (displayln "runtime-dependency-cache-ready"))' >/tmp/gerbil-dependency-cache-check.log 2>&1; then
            gerbil env gerbil interactive packages/automation/runtime-dependencies.ss
            # Restore the vendored Core pin after recursive dependency installation.
            (cd core && GERBIL_PATH="$GITHUB_WORKSPACE/.gerbil" gerbil env gerbil interactive ../packages/automation/runtime-dependencies.ss)
            rebuild_dependents=true
          fi
          gerbil env gerbil interactive -e '(begin (import :clan/poo/object) (displayln "runtime-dependencies-ready"))'
          # Clean the vendored package through its native build declaration.
          # Its development cleanup script imports the previously built Core.
          (cd core && GERBIL_PATH="$GITHUB_WORKSPACE/.gerbil" gerbil env gerbil clean)
          gerbil env just build-core
          if "$rebuild_dependents"; then
            gerbil env gerbil interactive packages/automation/runtime-dependencies.ss --rebuild-core-dependents
          fi

      - name: Save Gerbil package cache
        if: steps.runtime-gerbil-pkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .gerbil/pkg
            .gerbil/lib
            .gerbil/bin
          key: gerbil-deps-v4-${{ runner.os }}-${{ runner.arch }}-${{ matrix.gerbil-label }}-${{ steps.runtime-core-source.outputs.revision }}-${{ hashFiles('gerbil.pkg', 'core/gerbil.pkg', 'packages/automation/install_gerbil_release.py', 'packages/automation/runtime-dependencies.ss') }}

      - name: Link the Lab source package for downstream qualification
        run: |
          gerbil env gerbil pkg link github.com/tao3k/agentic-ai-lab "$GITHUB_WORKSPACE"
          mkdir -p dev/.gerbil/lib

      - name: Reject Core build input context regressions
        working-directory: core
        env:
          GERBIL_PATH: ${{ github.workspace }}/.gerbil
          GERBIL_LOADPATH: ${{ github.workspace }}/.gerbil/lib
        run: |
          just test-build-input-context-mutations "$RUNNER_TEMP/build-input-context"
          just test-file t/module-publication-test.ss
          just test-file t/module-testing-source-admission-test.ss

      - name: Check Authoring zero-carrier assertions
        if: runner.os == 'macOS'
        working-directory: core
        env:
          GERBIL_PATH: ${{ github.workspace }}/.gerbil
          GERBIL_LOADPATH: ${{ github.workspace }}/.gerbil/lib
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/lab-authoring-carriers.log"
          /usr/bin/time -p just test-file t/module-authoring-dispatch-work-test.ss 2>&1 | tee "$log"
          grep -q '^MODULE-OK ' "$log"
          grep -q '^HARNESS-OK ' "$log"
          grep -qx 'OK' "$log"
          if grep -Eq 'ERROR (CASE|CHECK|HARNESS)|Heap overflow|Stack overflow' "$log"; then
            exit 1
          fi

      # Downstreams build their own selected products. Run this gate before
      # the development library can supply precompiled Lab modules.
      - name: Qualify real selected downstreams
        id: downstreams
        continue-on-error: ${{ runner.os == 'macOS' }}
        env:
          LAB_MACOS_QUALIFICATION_TIMING: ${{ runner.os == 'macOS' && '1' || '' }}
          GERBIL_LOADPATH: ${{ github.workspace }}/.gerbil/lib
          LAB_TRACE_PRELUDE_CONTEXT: ${{ runner.os == 'macOS' && '1' || '' }}
        shell: bash
        run: |
          set -euo pipefail
          # Keep Gerbil’s linked-package manifest for Memory, then clean the Lab products.
          gerbil env gerbil pkg build github.com/tao3k/agentic-ai-lab
          gerbil env just clean
          # Measure Memory before the other independent downstreams use this runner.
          # Run every gate even if an earlier gate fails, then preserve the failure.
          downstream_status=0
          for category in context-memory governance deployment; do
            suite="t/yuanxu-$category-downstream-test.ss"
            if [[ "$category" == deployment ]]; then
              suite="t/yanxu/modules/services/opentofu/deployment-test.ss"
            fi
            /usr/bin/time -p gerbil env just test-file "$suite" 2>&1 | tee "$RUNNER_TEMP/lab-$category-downstream.log" || downstream_status=$?
          done
          if (( downstream_status != 0 )); then
            exit "$downstream_status"
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          selections = {
              "governance": ("LAB-GOVERNANCE-PRODUCT-USE-OK",
                             "profile=governance roots=1 selected-tests=1 cold=A/B hot=0 clean-isolation=ok"),
              "deployment": ("LAB-DEPLOYMENT-PRODUCT-USE-OK",
                             "profile=deployment roots=1 owners=4 discovered-tests=3 lab-tests=1 runtime-qualification=1 cold=A/B hot=0 clean-isolation=ok"),
              "context-memory": ("LAB-CONTEXT-USE-OK mode=base",
                                 "LAB-CONTEXT-USE-OK mode=enabled",
                                 "LAB-CONTEXT-USE-OK mode=withdrawn",
                                 "LAB-CONTEXT-REFUSAL-OK owner=ai-agentic-context feature=memory",
                                 "LAB-CONTEXT-MEMORY-DOWNSTREAM-OK",
                                 "hot=0 clean-isolation=ok scopes-during-build=0"),
          }
          forbidden = ("ERROR CASE", "ERROR CHECK", "ERROR HARNESS", "Heap overflow", "Stack overflow")
          for category, markers in selections.items():
              text = (Path(os.environ["RUNNER_TEMP"]) / f"lab-{category}-downstream.log").read_text()
              required = ("MODULE-OK", "HARNESS-OK", *markers)
              if (not all(marker in text for marker in required)
                      or any(marker in text for marker in forbidden)
                      or not re.search(r"^OK\s*$", text, re.M)):
                  raise SystemExit(f"{category} downstream receipt is incomplete or failed")
              # Scheme compares the exact selected targets with both cold
              # outputs. Installed prerequisites can change their count.
              if category == "deployment" and not re.search(
                      r"^LAB-DEPLOYMENT-DOWNSTREAM-OK targets=[1-9][0-9]* "
                      + re.escape(markers[1]) + r"\s*$", text, re.M):
                  raise SystemExit("deployment downstream target receipt is missing")
          PY

      - name: Build the development library
        run: |
          qualification="$RUNNER_TEMP/lab-qualification"
          mkdir -p "$qualification/lib"
          gerbil env env GERBIL_PATH="$qualification" GERBIL_LOADPATH="$GITHUB_WORKSPACE/.gerbil/lib" just build-qualification-library

      - name: Install optional development policy dependencies
        run: |
          (cd dev && GERBIL_PATH="$GITHUB_WORKSPACE/dev/.gerbil" GERBIL_LOADPATH="$GITHUB_WORKSPACE/.gerbil/lib" gerbil env gerbil interactive ../packages/automation/runtime-dependencies.ss)
          export GERBIL_LOADPATH="$GITHUB_WORKSPACE/.gerbil/lib:$GITHUB_WORKSPACE/dev/.gerbil/lib:$RUNNER_TEMP/lab-qualification/lib"
          echo "GERBIL_LOADPATH=$GERBIL_LOADPATH" >> "$GITHUB_ENV"

      - name: Qualify selected Agentic Context memory
        run: gerbil env just test-file t/yanxu/modules/ai-agentic-context/core-test.ss

      - name: Retain build input context and real downstream evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-input-context-${{ runner.os }}
          path: |
            ${{ runner.temp }}/build-input-context/**/receipt.json
            ${{ runner.temp }}/build-input-context/**/*.log
            ${{ runner.temp }}/lab-governance-downstream.log
            ${{ runner.temp }}/lab-deployment-downstream.log
            ${{ runner.temp }}/lab-context-memory-downstream.log
            ${{ runner.temp }}/lab-authoring-carriers.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Check original Temporal proof binding and Session invalidation
        env:
          LAB_MACOS_QUALIFICATION_TIMING: ${{ runner.os == 'macOS' && '1' || '' }}
          AGENTIC_AI_LAB_TEST_STALL_DIAGNOSTICS: ${{ runner.temp }}/agentic-ai-lab-test-stalls
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -p gerbil env just test-context-temporal 2>&1 | tee "$RUNNER_TEMP/lab-context-temporal.log"

      - name: Retain Temporal qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: context-temporal-${{ runner.os }}
          path: ${{ runner.temp }}/lab-context-temporal.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Reject failed macOS downstream qualification
        if: always() && runner.os == 'macOS' && steps.downstreams.outcome == 'failure'
        run: exit 1

      - name: Build qualification test workers
        run: gerbil env just build-testing build-test-workers

      - name: Install pinned Nix daemon for publication tests
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.4/install
          enable_kvm: false

      - name: Prepare explicit qualification inputs
        run: gerbil env just prepare-test-inputs

      - name: Run Lab unit tests through bounded Gerbil Harness batches
        env:
          LAB_MACOS_QUALIFICATION_TIMING: ${{ runner.os == 'macOS' && '1' || '' }}
        run: |
          set -euo pipefail
          gerbil env just test-root 2>&1 | tee "$RUNNER_TEMP/agentic-ai-lab-unit-tests.log"

      - name: Produce native C and Scheme projection wheel handoffs
        if: runner.os == 'Linux'
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/python-runtime/src
        run: gerbil env python3 packages/automation/native_library_handoff.py

      - name: Retain native library handoffs
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agentic-ai-lab-runtime-library
          path: .ci/runtime-c
          if-no-files-found: warn
          retention-days: 7

      - name: Retain native Scheme projection handoff
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-wheel-scheme-projection-producer
          path: .ci/python-wheel-projection
          if-no-files-found: warn
          retention-days: 7

      - name: Build Scheme semantic AOT byte boundary
        env:
          GERBIL_PATH: ${{ github.workspace }}/.gerbil
          GERBIL_LOADPATH: ${{ github.workspace }}/.gerbil/lib
        run: |
          mkdir -p .ci/semantic
          extension=so
          if [ "$RUNNER_OS" = macOS ]; then extension=dylib; fi
          python3 bindings/runtime-c/tools/build-semantic.py \
            --output ".ci/semantic/libagentic_ai_lab_semantic.$extension"

      - name: Upload immutable semantic AOT producer artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentic-ai-lab-semantic-runtime-linux
          path: |
            .ci/semantic/libagentic_ai_lab_semantic.so
            .ci/semantic/libagentic_ai_lab_semantic.so.ss

      - name: Run declared ASCENT package integration
        if: runner.os == 'Linux'
        run: |
          gerbil env just test-ascent-integration
          # The native worker already owns its five-second progress watchdog.
          # Its Just entry retains the 45-second total cap, source guards and
          # strict Harness/Case admission; preparation has no duplicate watcher.
          gerbil env just test-ascent-temporal
          PYTHONPATH="$GITHUB_WORKSPACE/packages/python-testing/src" \
            gerbil env python3 -m agentic_ai_lab_testing run \
              --case ascent.source-withdrawal
          PYTHONPATH="$GITHUB_WORKSPACE/packages/python-testing/src" \
            gerbil env python3 -m agentic_ai_lab_testing run \
              --case evidence-ascent.hypothesis-status
          PYTHONPATH="$GITHUB_WORKSPACE/packages/python-testing/src" \
            gerbil env python3 -m agentic_ai_lab_testing run \
              --case model-study.runtime-fixtures

      - name: Run runtime performance scenarios without unit-batch contention
        if: runner.os == 'Linux'
        run: |
          gerbil env gxc -O modules/workflow/qualification/ascent-table-expression.ss t/scenarios/performance/ascent-table-expression/baseline.ss
          gerbil env just test-performance
          gerbil env gxi t/scenarios/performance/ascent-table-expression/scenario.ss
          gerbil env gxi t/scenarios/performance/ascent-table-expression-membership/scenario.ss
          gerbil env gxi t/scenarios/performance/ascent-reachability-closure/scenario.ss

      - name: Upload failed natural-exit stack
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-test-stall-macOS
          path: ${{ runner.temp }}/agentic-ai-lab-test-stalls
          if-no-files-found: warn
          retention-days: 7

      - name: Upload focused native unit-test output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-unit-output-${{ runner.os }}
          path: ${{ runner.temp }}/agentic-ai-lab-unit-tests.log
          if-no-files-found: ignore
          retention-days: 7

  quint-proof:
    name: ${{ matrix.phase == 'typecheck' && 'Quint types and source binding' || 'Quint finite proof models' }}
    runs-on: ubuntu-latest
    # Typechecking and verification retain their complete inventories but do
    # not consume the same job deadline. Per-case fences remain unchanged.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        phase: [typecheck, verification]
    steps:
      - name: Checkout agentic-ai-lab
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Initialize Core proof backend
        run: git submodule update --init core
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare pinned Quint backend
        env:
          QUINT_HOME: ${{ runner.temp }}/agentic-ai-lab-quint-cache
        run: |
          npm ci --prefix packages/proofs/quint --no-audit --no-fund
          python3 packages/proofs/quint/prepare_backend.py
      - name: Check types, receipt admission and source binding
        if: matrix.phase == 'typecheck'
        env:
          PYTHONPATH: packages/python-testing/src
        run: |
          python3 packages/proofs/quint/typecheck.py
          python3 -m unittest discover -s packages/proofs/quint -p 'test_*.py'
          python3 packages/proofs/quint/source_binding.py
      - name: Verify all finite, temporal and fault cases
        if: matrix.phase == 'verification'
        env:
          PYTHONPATH: packages/python-testing/src
          QUINT_HOME: ${{ runner.temp }}/agentic-ai-lab-quint-cache
        run: |
          python3 -m agentic_ai_lab_testing.checks.quint --group all \
            --receipt "$RUNNER_TEMP/poo-quint-proof.ss"
      - name: Verify migrated assessment protocols and negative controls
        if: matrix.phase == 'verification'
        env:
          PYTHONPATH: packages/python-testing/src
          QUINT_HOME: ${{ runner.temp }}/agentic-ai-lab-quint-cache
        run: python3 -m agentic_ai_lab_testing.checks.assessment_formal quint all
      - name: Upload Quint receipt
        if: matrix.phase == 'verification'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quint-proof-receipt
          path: ${{ runner.temp }}/poo-quint-proof.ss
          if-no-files-found: error
          retention-days: 7

  session-poo-proof:
    name: Session and WorkTree LeanPoo proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout agentic-ai-lab
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build Session and WorkTree proofs with axiom audit
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1
        with:
          lake-package-directory: packages/proofs/lean-poo
          auto-config: false
          build: true
          build-args: AgenticAILabSessionProof AgenticAILabContextProof AgenticAILabAttemptProof

  lean-proof:
    name: Lean module / ${{ matrix.owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - owner: governance
            target: AgenticAILabModuleGovernanceProof
            ffi: true
          - owner: temporal-causality
            target: AgenticAILabModuleTemporalCausalityProof
            ffi: false
          - owner: healthcare-scenario
            target: AgenticAILabScenarioHealthcareProof
            ffi: false
          - owner: authorization
            target: AgenticAILabModuleAuthorizationProof
            ffi: false
          - owner: loop-engine
            target: AgenticAILabModuleLoopEngineProof
            ffi: false
          - owner: session
            target: AgenticAILabModuleSessionProof
            ffi: false
          - owner: sandbox-core
            target: AgenticAILabModuleSandboxCoreProof
            ffi: false
          - owner: funflow
            target: AgenticAILabModuleFunflowProof
            ffi: false
          - owner: workflow
            target: AgenticAILabModuleWorkflowProof
            ffi: false
          - owner: evidence-assessment
            target: AgenticAILabModuleEvidenceAssessmentProof
            ffi: false
          - owner: memory-core
            target: AgenticAILabModuleMemoryCoreProof
            ffi: false
    steps:
      - name: Checkout agentic-ai-lab
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize Core proof dependency
        run: git submodule update --init core

      - name: Restore Lean cache
        id: lean-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            packages/proofs/lean/.lake
            core/dev/proofs/lean/.lake
          key: lean-proof-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/proofs/lean/lean-toolchain', 'packages/proofs/lean/lakefile.lean', 'packages/proofs/lean/lake-manifest.json', 'core/dev/proofs/lean/lakefile.lean', 'core/dev/proofs/lean/lake-manifest.json') }}
          restore-keys: |
            lean-proof-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          cd packages/proofs/lean
          "$HOME/.elan/bin/lake" --version

      - name: Build runtime Lean module library
        working-directory: packages/proofs/lean
        shell: bash
        run: |
          set -euo pipefail
          lake build "${{ matrix.target }}"

      - name: Build and run the independent Lean FFI smoke
        if: matrix.ffi
        working-directory: packages/proofs/lean
        shell: bash
        run: |
          set -euo pipefail
          lake build ffiSmoke
          .lake/build/bin/ffiSmoke

      - name: Save Lean cache
        if: steps.lean-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            packages/proofs/lean/.lake
            core/dev/proofs/lean/.lake
          key: lean-proof-${{ matrix.target }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/proofs/lean/lean-toolchain', 'packages/proofs/lean/lakefile.lean', 'packages/proofs/lean/lake-manifest.json', 'core/dev/proofs/lean/lakefile.lean', 'core/dev/proofs/lean/lake-manifest.json') }}

  cedar-rust-runtime-host:
    name: Cedar Rust Runtime Host
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout agentic-ai-lab
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Restore Lean Runtime Host cache
        id: lean-runtime-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            packages/proofs/lean/.lake
            core/dev/proofs/lean/.lake
          key: lean-proof-cedarRuntimeHost-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/proofs/lean/lean-toolchain', 'packages/proofs/lean/lakefile.lean', 'packages/proofs/lean/lake-manifest.json', 'core/dev/proofs/lean/lakefile.lean', 'core/dev/proofs/lean/lake-manifest.json') }}
          # Reuse the same Lake package and pinned native compiler.
          restore-keys: |
            lean-proof-AgenticAILabModuleGovernanceProof-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/proofs/lean/lean-toolchain', 'packages/proofs/lean/lakefile.lean', 'packages/proofs/lean/lake-manifest.json', 'core/dev/proofs/lean/lakefile.lean', 'core/dev/proofs/lean/lake-manifest.json') }}
            lean-proof-cedarRuntimeHost-${{ runner.os }}-${{ runner.arch }}-
            lean-proof-AgenticAILabModuleGovernanceProof-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Cedar Runtime Host toolchains
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Build Cedar AOT Runtime Host
        shell: bash
        run: |
          set -euo pipefail
          host="$RUNNER_TEMP/cedarRuntimeHost"
          AGENTIC_AI_LAB_CEDAR_BUILD_PROFILE=dev \
            python3 packages/automation/build_cedar_runtime_host.py "$host"
          echo "AGENTIC_AI_LAB_CEDAR_RUNTIME_HOST=$host" >> "$GITHUB_ENV"

      - name: Run Cedar Rust Runtime Host tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked \
            --manifest-path bindings/cedar-gerbil/Cargo.toml \
            -p agentic-ai-lab-cedar-authority \
            --features runtime-host-qualification \
            --test runtime_host \
            --test authorization \
            --test case_check

      - name: Replay generic Cedar artifact cases
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet \
            --manifest-path bindings/cedar-gerbil/Cargo.toml \
            -p agentic-ai-lab-cedar-authority --bin cedar-case-check -- \
            bindings/cedar-gerbil/fixtures/atomic-case/manifest.json \
            "$AGENTIC_AI_LAB_CEDAR_RUNTIME_HOST" \
            bindings/cedar-gerbil/fixtures/atomic-case/policies.cedar

      - name: Save Lean Runtime Host cache
        if: steps.lean-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elan
            packages/proofs/lean/.lake
            core/dev/proofs/lean/.lake
          key: lean-proof-cedarRuntimeHost-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/proofs/lean/lean-toolchain', 'packages/proofs/lean/lakefile.lean', 'packages/proofs/lean/lake-manifest.json', 'core/dev/proofs/lean/lakefile.lean', 'core/dev/proofs/lean/lake-manifest.json') }}

  python-runtime-wheel:
    name: Python runtime wheel
    needs: [runtime-gerbil-tests]
    uses: ./.github/workflows/python-runtime-wheel.yml
